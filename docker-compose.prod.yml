services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corporate_filing_app_prod
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - APP_ENV=prod
      - S3_ENDPOINT_URL=http://minio:9000
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./data/app:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    networks:
      - cfi_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio:
    image: minio/minio:latest
    container_name: corporate_filing_minio_prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - ./data:/data
    networks:
      - cfi_internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: corporate_filing_qdrant_prod
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - cfi_internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: corporate_filing_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - cfi_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  cfi_internal:
    driver: bridge

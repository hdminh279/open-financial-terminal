services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corporate_filing_app
    environment:
      - APP_ENV=docker
    env_file:
      - .env
    depends_on:
      - minio
      - qdrant
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./configs:/app/configs
      - ./transform/:/app/transform
      - ./data:/app/data
    ports:
      - "8000:8000"
    working_dir: /app
    stdin_open: true
    tty: true
    command: uv run uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  minio:
    image: minio/minio:latest
    container_name: corporate_filing_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: corporate_filing_qdrant
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

[project]
name = "corporate-filing-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.122",
    "dbt-duckdb>=1.11.1",
    "ddgs>=9.16.1",
    "duckdb>=2.0.0",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.162.5",
    "fastembed>=0.4.0",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "langgraph>=1.2.21",
    "lxml>=6.1.3",
    "openai>=3.49.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.12.0",
    "ruff>=0.17.3",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: marks tests as requiring external live API access (run with -m live)",
    "integration: marks tests as integration tests",
]


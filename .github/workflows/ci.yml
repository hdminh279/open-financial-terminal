name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, Format, JS Check & Offline Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install frozen dependencies
        run: uv sync --frozen

      - name: Ruff lint check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Frontend JavaScript syntax check
        run: node --check src/ui/app.js

      - name: Run offline unit tests
        env:
          APP_ENV: local
          USE_TEST_FIXTURES: "true"
        run: uv run pytest tests/unit -q

  docker-build:
    name: Production Docker Image Build Check
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Dockerfile builds cleanly
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cfi-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

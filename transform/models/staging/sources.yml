          external_location: "s3://sec-silver/facts/facts.parquet"

      - name: vn_facts
        description: "Standardized VAS fact observations across VN30 companies with 6-gate validation."
        meta:
          external_location: "s3://sec-silver/facts/vn_facts.parquet"

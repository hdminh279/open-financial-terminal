  <!-- Canvas Background -->
  <rect width="1400" height="780" rx="16" fill="#F8FAFC"/>

  <!-- Header -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0F172A">Corporate Filing Intelligence — System Architecture</text>
  <text x="40" y="68" font-size="13" fill="#475569">Local-First Medallion Lakehouse (150 Issuers: 100 SEC EDGAR + 50 Vietnam HOSE) · Hybrid Vector RAG · Deterministic SQL · Guarded LangGraph Agent</text>

  <!-- Column 1: Data Sources -->
  <rect x="32" y="92" width="246" height="620" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="50" y="122" font-size="14" font-weight="700" fill="#1E40AF">1. DATA SOURCES ($0 APIs)</text>

  <rect x="48" y="142" width="214" height="126" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="64" y="170" font-size="14" font-weight="700" fill="#0F172A">SEC EDGAR Public API</text>
  <text x="64" y="192" font-size="12" fill="#334155">100 Global Issuers</text>
  <text x="64" y="210" font-size="11.5" fill="#64748B">• 52 US (10-K / 10-Q)</text>
  <text x="64" y="228" font-size="11.5" fill="#64748B">• 48 Intl FPI (20-F / IFRS)</text>
  <text x="64" y="246" font-size="11.5" fill="#64748B">• XBRL Company Facts + HTML</text>

  <rect x="48" y="286" width="214" height="126" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="64" y="314" font-size="14" font-weight="700" fill="#0F172A">VNDirect Finfo API</text>
  <text x="64" y="336" font-size="12" fill="#334155">50 Vietnam HOSE Issuers</text>
  <text x="64" y="354" font-size="11.5" fill="#64748B">• 30 VN30 + 20 Sector Leaders</text>
  <text x="64" y="372" font-size="11.5" fill="#64748B">• VAS, VAS-BANK (Model 101/102)</text>
  <text x="64" y="390" font-size="11.5" fill="#64748B">• Securities &amp; Insurance Models</text>

  <rect x="48" y="430" width="214" height="114" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="64" y="458" font-size="14" font-weight="700" fill="#0F172A">Live Market &amp; Web</text>
  <text x="64" y="480" font-size="11.5" fill="#64748B">• Finnhub &amp; SSI Live Quotes</text>
  <text x="64" y="498" font-size="11.5" fill="#64748B">• DuckDuckGo + Google News RSS</text>
  <text x="64" y="516" font-size="11.5" fill="#64748B">• Token Bucket Rate Limiters</text>

  <rect x="48" y="562" width="214" height="130" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="64" y="588" font-size="12.5" font-weight="700" fill="#1E3A8A">Ingestion Engine (PC / CLI)</text>
  <text x="64" y="610" font-size="11.5" fill="#1E40AF">• SHA-256 Idempotency</text>
  <text x="64" y="628" font-size="11.5" fill="#1E40AF">• Tenacity Exponential Backoff</text>
  <text x="64" y="646" font-size="11.5" fill="#1E40AF">• Runs standalone on PC</text>
  <text x="64" y="664" font-size="11.5" fill="#1E40AF">  (no Docker Compose / dbt)</text>

  <!-- Column 2: Medallion Lakehouse & Vector Store -->
  <rect x="314" y="92" width="318" height="620" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="332" y="122" font-size="14" font-weight="700" fill="#065F46">2. LAKEHOUSE &amp; VECTOR DB</text>

  <rect x="332" y="142" width="282" height="94" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="348" y="168" font-size="13.5" font-weight="700" fill="#0F172A">MinIO Bronze (sec-bronze)</text>
  <text x="348" y="189" font-size="11.5" fill="#64748B">• Raw Company Facts, Submissions, HTML</text>
  <text x="348" y="207" font-size="11.5" fill="#64748B">• Raw VN Statements + _metadata.json</text>
  <text x="348" y="224" font-size="11.5" fill="#059669" font-weight="600">Immutable Legal Audit Trail</text>

  <rect x="332" y="252" width="282" height="104" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="348" y="278" font-size="13.5" font-weight="700" fill="#0F172A">MinIO Silver (sec-silver)</text>
  <text x="348" y="299" font-size="11.5" fill="#64748B">• Standardized Facts &amp; Clean HTML Sections</text>
  <text x="348" y="317" font-size="11.5" fill="#64748B">• 6-Rule Quality Gate + Quarantine Anomalies</text>
  <text x="348" y="335" font-size="11.5" fill="#64748B">• Persisted Chat History &amp; Watchlist</text>

  <rect x="332" y="372" width="282" height="114" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <text x="348" y="398" font-size="13.5" font-weight="700" fill="#0F172A">MinIO Gold (sec-gold · dbt-duckdb)</text>
  <text x="348" y="419" font-size="11.5" fill="#64748B">• fct_financial_statements &amp; ratios (Parquet)</text>
  <text x="348" y="437" font-size="11.5" fill="#64748B">• Derived Q4 = FY - 9M (EPS excluded)</text>
  <text x="348" y="455" font-size="11.5" fill="#64748B">• Bank vs Corporate Isolation, NULL != 0</text>
  <text x="348" y="473" font-size="11.5" fill="#059669" font-weight="600">Built on Laptop · Read-Only SQL (&lt;50ms)</text>

  <rect x="332" y="506" width="282" height="186" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <text x="348" y="532" font-size="13.5" font-weight="700" fill="#0F172A">Qdrant Vector DB</text>
  <text x="348" y="554" font-size="11.5" fill="#64748B">• Structure- &amp; Table-Aware Chunks (512 tok)</text>
  <text x="348" y="572" font-size="11.5" fill="#64748B">• Dense: BAAI/bge-small-en-v1.5 (384-dim)</text>
  <text x="348" y="590" font-size="11.5" fill="#64748B">• Sparse: Qdrant/bm25 (Lexical Exact Match)</text>
  <text x="348" y="608" font-size="11.5" fill="#64748B">• Server-Side Hybrid RRF (k=60) + Reranker</text>
  <text x="348" y="626" font-size="11.5" fill="#64748B">• Indexed Payload Filters (ticker, form, FY)</text>
  <text x="348" y="648" font-size="11.5" fill="#059669" font-weight="600">205,737+ Vectors · Hit@5 = 90.0% (18.5ms)</text>
  <text x="348" y="666" font-size="11" fill="#64748B">Synced via CorpusSyncEngine (UUIDv5)</text>

  <!-- Column 3: LangGraph AI Agent & Guardrails -->
  <rect x="668" y="92" width="382" height="620" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="688" y="122" font-size="14" font-weight="700" fill="#92400E">3. LANGGRAPH AGENT &amp; GUARDRAILS</text>

  <rect x="688" y="142" width="336" height="72" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="704" y="168" font-size="13.5" font-weight="700" fill="#991B1B">Pre-LLM Security &amp; Cache Layer</text>
  <text x="704" y="188" font-size="11.5" fill="#7F1D1D">• Prompt Injection &amp; Secret Guard (&lt;1ms, $0)</text>
  <text x="704" y="204" font-size="11.5" fill="#7F1D1D">• Bounded LRU TTLQueryCache (&lt;50ms repeat hit)</text>

  <rect x="688" y="232" width="336" height="80" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="704" y="258" font-size="13.5" font-weight="700" fill="#0F172A">Intent Router &amp; Query Planner</text>
  <text x="704" y="278" font-size="11.5" fill="#64748B">• Intents: Metric | Textual | Mixed | Report | OOS</text>
  <text x="704" y="296" font-size="11.5" fill="#64748B">• Contextual Isolation (Zero History Leak on News)</text>

  <!-- Parallel Tools Row -->
  <rect x="688" y="340" width="104" height="104" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="364" font-size="12" font-weight="700" fill="#0F172A">SQL Tool</text>
  <text x="700" y="384" font-size="10.5" fill="#64748B">DuckDB</text>
  <text x="700" y="400" font-size="10.5" fill="#64748B">Parameterized</text>
  <text x="700" y="416" font-size="10.5" fill="#64748B">Read-Only</text>
  <text x="700" y="432" font-size="10.5" fill="#059669" font-weight="600">Batch Mode</text>

  <rect x="804" y="340" width="104" height="104" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="816" y="364" font-size="12" font-weight="700" fill="#0F172A">Hybrid RAG</text>
  <text x="816" y="384" font-size="10.5" fill="#64748B">Multi-Entity</text>
  <text x="816" y="400" font-size="10.5" fill="#64748B">Fan-Out</text>
  <text x="816" y="416" font-size="10.5" fill="#64748B">Dense + BM25</text>
  <text x="816" y="432" font-size="10.5" fill="#059669" font-weight="600">Year Filter</text>

  <rect x="920" y="340" width="104" height="104" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="932" y="364" font-size="12" font-weight="700" fill="#0F172A">Web Tool</text>
  <text x="932" y="384" font-size="10.5" fill="#64748B">DuckDuckGo</text>
  <text x="932" y="400" font-size="10.5" fill="#64748B">+ Google RSS</text>
  <text x="932" y="416" font-size="10.5" fill="#64748B">TTL Cache</text>
  <text x="932" y="432" font-size="10.5" fill="#059669" font-weight="600">Live News</text>

  <rect x="688" y="466" width="336" height="100" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="704" y="492" font-size="13.5" font-weight="700" fill="#0F172A">3-Tier Abstention &amp; Comparability Gate</text>
  <text x="704" y="512" font-size="11.5" fill="#64748B">• Separates TOOL_FAILED vs NO_DATA_FOUND</text>
  <text x="704" y="530" font-size="11.5" fill="#64748B">• Blocks Mixed-Currency Bar/Line Charts</text>
  <text x="704" y="548" font-size="11.5" fill="#64748B">• Auto Shifted Fiscal-Year Footnotes (NVDA, TM, INFY)</text>

  <rect x="688" y="584" width="336" height="110" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="704" y="610" font-size="13.5" font-weight="700" fill="#0F172A">DeepSeek Synthesizer &amp; Citation Engine</text>
  <text x="704" y="630" font-size="11.5" fill="#64748B">• Pluggable BaseLLMAdapter (deepseek-flash)</text>
  <text x="704" y="648" font-size="11.5" fill="#64748B">• Inline [1], [2] Citations to SEC EDGAR / VNDirect URLs</text>
  <text x="704" y="666" font-size="11.5" fill="#64748B">• Plotly / Chart.js Specs (connectgaps: False)</text>
  <text x="704" y="684" font-size="11.5" fill="#B45309" font-weight="600">100% Verifiable Provenance Links</text>

  <!-- Column 4: API, UI & Production Deploy -->
  <rect x="1084" y="92" width="284" height="620" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>

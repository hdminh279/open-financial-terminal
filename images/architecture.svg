    <path d="M34 25l8 3.5v5.5c0 5-3.4 9.2-8 10.8-4.6-1.6-8-5.8-8-10.8v-5.5L34 25z" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M30.5 35l2.5 2.5 4.8-4.8" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="40" font-size="14" font-weight="600" fill="#0f172a">Security Guard</text>

  <text x="1118" y="472" font-size="11.5" fill="#2563EB" font-weight="600">http://localhost:8000</text>

  <rect x="1102" y="518" width="248" height="174" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1118" y="546" font-size="13.5" font-weight="700" fill="#F8FAFC">24/7 Public Cloud ($0/mo)</text>
  <text x="1118" y="570" font-size="11.5" fill="#CBD5E1">• Oracle Cloud Always Free VM</text>
  <text x="1118" y="588" font-size="11.5" fill="#94A3B8">  (4 ARM OCPU · 24 GB RAM)</text>
  <text x="1118" y="610" font-size="11.5" fill="#CBD5E1">• Cloudflare Zero Trust Tunnel</text>

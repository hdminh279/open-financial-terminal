  <line x1="820" y1="257" x2="820" y2="302" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="815,259 820,251 825,259" fill="#4f46e5"/>
  <polygon points="815,300 820,308 825,300" fill="#4f46e5"/>


  <text x="1118" y="192" font-size="11.5" fill="#64748B">• /api/query  /api/metrics</text>
  <text x="1118" y="210" font-size="11.5" fill="#64748B">• /api/companies  /api/watchlist</text>
  <text x="1118" y="228" font-size="11.5" fill="#64748B">• /api/health  /api/telemetry</text>

  <text x="1118" y="392" font-size="11.5" fill="#64748B">• Interactive Charts &amp; CSV/JSON Export</text>
  <text x="1118" y="410" font-size="11.5" fill="#64748B">• Clickable Citation Drawer</text>
  <text x="1118" y="428" font-size="11.5" fill="#64748B">• Live Watchlist (US + VN Quotes)</text>

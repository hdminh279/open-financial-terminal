  <!-- VNDirect (200,225) -> MinIO (254,172) -->
  <path d="M 200 225 C 228 225, 226 172, 248 172" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="246,167 254,172 246,177" fill="#64748b"/>

  <!-- MinIO (450,165) -> DuckDB (510,105) -->
  <path d="M 450 158 C 478 158, 478 105, 504 105" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="502,100 510,105 502,110" fill="#64748b"/>

  <!-- MinIO (450,172) -> Qdrant (510,225) -->
  <path d="M 450 172 C 478 172, 478 225, 504 225" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="502,220 510,225 502,230" fill="#64748b"/>


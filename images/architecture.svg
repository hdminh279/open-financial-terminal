    <path d="M34 24l2.4 7.6L44 34l-7.6 2.4L34 44l-2.4-7.6L24 34l7.6-2.4z" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="62" y="40" font-size="14" font-weight="600" fill="#0f172a">DeepSeek</text>

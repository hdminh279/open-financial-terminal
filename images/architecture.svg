  <text x="352" y="38" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#64748b">STORAGE</text>
  <text x="586" y="38" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#64748b">ENGINES</text>
  <text x="820" y="38" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#64748b">AI AGENT</text>
  <text x="1062" y="38" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#64748b">PROTECTION</text>
  <text x="1270" y="38" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#64748b">INTERFACE</text>


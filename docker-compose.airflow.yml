x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_PG_PASSWORD:?AIRFLOW_PG_PASSWORD is required}@airflow-postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY is required}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    APP_ENV: prod
    S3_ENDPOINT_URL: http://minio:9000
    QDRANT_URL: http://qdrant:6333
    PYTHONPATH: /opt/airflow
    FASTEMBED_CACHE_PATH: /opt/airflow/models/fastembed
    HF_HOME: /opt/airflow/models/huggingface
  volumes:
    - ./dags:/opt/airflow/dags
    - ./backend:/opt/airflow/backend:ro
    - ./pipelines:/opt/airflow/pipelines:ro
    - ./configs:/opt/airflow/configs:ro
    - ./transform:/opt/airflow/transform
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./models:/opt/airflow/models
  networks:
    - cfi_internal
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:16-alpine
    container_name: corporate_filing_airflow_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_PG_PASSWORD:?AIRFLOW_PG_PASSWORD is required}
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    networks:
      - cfi_internal
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: corporate_filing_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@localhost \
          --password "${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}" || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: corporate_filing_airflow_web
    restart: unless-stopped
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: corporate_filing_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    mem_limit: 1536m
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_pg_data:

networks:
  cfi_internal:
    external: true
    name: cfi_internal

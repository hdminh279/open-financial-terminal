version: "4.0"
description: "Comprehensive US-GAAP Taxonomy mapping, Financial Metric Registry, and Semantic Validation rules"

# Standard validation constraints
constraints:
  allowed_units:
    - "USD"
    - "USD/shares"
    - "EUR"
    - "EUR/shares"
    - "TWD"
    - "TWD/shares"
    - "INR"
    - "INR/shares"
    - "GBP"
    - "GBP/shares"
    - "JPY"
    - "JPY/shares"
    - "SEK"
    - "SEK/shares"
    - "BRL"
    - "BRL/shares"
    - "DKK"
    - "DKK/shares"
  null_allowed_metrics:
    - "gross_profit"  # Alphabet (GOOGL) does not report Gross Profit (TAC-based model); must remain NULL, never 0
  value_datatype: "DECIMAL(28, 2)"  # High-precision fixed point, avoids IEEE-754 floating-point errors
  accounting_equations:
    balance_sheet:
      formula: "total_assets == total_liabilities + stockholders_equity_total"
      type: "soft_check"  # Audit warning only; never drops records due to mezzanine equity or rounding
      tolerance_usd: 1000.0

# Period duration classification thresholds (evaluates duration_days without overriding SEC official fy/fp)
duration_rules:
  discrete_quarter:
    min_days: 80
    max_days: 105
    description: "Discrete ~3-month single quarter period reported in Form 10-Q"
  cumulative_6m:
    min_days: 160
    max_days: 200
    description: "Cumulative ~6-month Year-To-Date period reported in Q2 Form 10-Q"
  cumulative_9m:
    min_days: 250
    max_days: 295
    description: "Cumulative ~9-month Year-To-Date period reported in Q3 Form 10-Q"
  annual_12m:
    min_days: 350
    max_days: 375
    description: "Full fiscal year ~12-month period reported in Form 10-K"
  instant:
    min_days: 0
    max_days: 0
    description: "Point-in-time balance sheet snapshot where start_date is null"


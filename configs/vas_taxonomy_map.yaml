# ==============================================================================
# Vietnamese Accounting Standards (VAS) Taxonomy Mapping
# Legal Authorities:
# 1. Circular 200/2014/TT-BTC: Ministry of Finance guidelines on Enterprise Accounting Regime
# 2. Circular 49/2014/TT-NHNN & Decision 16/2007/QD-NHNN: State Bank of Vietnam Credit Institutions Regime
# 3. Circular 125/2016/TT-BTC & Circular 334/2016/TT-BTC: Securities Companies Regime
# 4. Circular 199/2014/TT-BTC: Insurance Enterprises Accounting Regime
# ==============================================================================

version: "1.0"
market: "VN"
description: "Authoritative VAS Taxonomy mapping, standard code dictionary, and metric alignment"

# Standard validation constraints
constraints:
  allowed_units:
    - "VND"
    - "VND/shares"
    - "%"
  value_datatype: "DECIMAL(28, 2)"  # High-precision fixed-point to prevent IEEE-754 floating-point errors
  accounting_equations:
    corporate_balance_sheet:
      formula: "total_assets == total_liabilities + stockholders_equity_total"
      type: "soft_check"
      tolerance_vnd: 1000000.0  # 1 million VND tolerance for rounding
    corporate_gross_profit:
      formula: "gross_profit == revenues - cost_of_goods_sold"
      type: "arithmetic_check"
    corporate_net_income:
      formula: "net_income == profit_before_tax - income_tax_expense"
      type: "arithmetic_check"
    banking_net_interest_income:
      formula: "net_interest_income == interest_income - interest_expense"
      type: "arithmetic_check"

